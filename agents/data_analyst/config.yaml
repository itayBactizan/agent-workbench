# Model settings
model: claude-opus-5-5
effort: high            # low | medium | high | xhigh | max. Use medium for quick EDA, high for modeling.
max_tokens: 16000       # per response
max_iterations: 30      # max agent loop turns per run (cost guardrail)
fallbacks: true         # re-run declined requests on a fallback model

# Prompt files, concatenated in order. Add shared files like ../_shared/style.md here.
prompt_files:
  - system_prompt.md

# Values for {{placeholders}} in the prompt files.
# data_dir and output_dir are provided automatically.
variables:
  audience: "data scientists and product managers on my team"
